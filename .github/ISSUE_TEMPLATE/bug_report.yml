name: Bug report
description: Something in the CLI or Action did not match the documented behavior
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command, or the Action inputs if this is a workflow.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: Exit code and the report you expected.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Exit code, stdout, and stderr. Do not paste secrets.
    validations:
      required: true
