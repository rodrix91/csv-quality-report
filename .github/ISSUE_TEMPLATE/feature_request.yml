name: Feature request
description: Suggest a small additive improvement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What CSV quality question is hard to answer today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that would help. Keep the standard-library runtime.
    validations:
      required: true
