name: Release

# Runs when a version tag is pushed or a release is published from the web
# page (which creates the tag). It checks that the tag matches the package
# version, builds the sdist and the wheel, runs the whole test suite from the
# unpacked sdist and from the installed wheel, and attaches both files to the
# GitHub release, creating it with the CHANGELOG section as notes when it does
# not exist yet. Both triggers can fire for one tag; the second run replaces
# the files with identical ones. Nothing is published to PyPI.

on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # only to create the release and upload its files
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          module=$(PYTHONPATH=src python -c "import csv_quality_report; print(csv_quality_report.__version__)")
          if [ "$TAG" != "v$version" ] || [ "$module" != "$version" ]; then
            echo "::error::tag $TAG does not match the package version (pyproject $version, module $module)"
            exit 1
          fi

      - name: Write the release notes from the CHANGELOG
        run: python scripts/release_notes.py "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Build the sdist and the wheel
        run: python -m build --outdir "$RUNNER_TEMP/dist" .

      - name: Run the tests from the unpacked sdist and the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes -r requirements-dev.lock
          "$RUNNER_TEMP/venv/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/dist/*.whl
          test "$("$RUNNER_TEMP/venv/bin/csv-quality-report" --version)" = "csv-quality-report ${TAG#v}"
          mkdir "$RUNNER_TEMP/sdist"
          tar xzf "$RUNNER_TEMP"/dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"/sdist/*/
          "$RUNNER_TEMP/venv/bin/python" -m pytest -p no:cacheprovider

      - name: Write SHA-256 checksums
        run: |
          cd "$RUNNER_TEMP/dist"
          sha256sum *.whl *.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Attach the files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/dist/* --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP"/dist/* --verify-tag \
              --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
