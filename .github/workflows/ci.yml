name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Coverage and static analysis are version-independent checks. Run them
    # once on the middle supported interpreter instead of instrumenting the
    # full ~1,250-test suite three times.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run tests with coverage
        run: |
          coverage run -m pytest
          coverage combine
          coverage report

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy

  linux:
    # Keep explicit compatibility checks on the other supported Python
    # versions without repeating coverage instrumentation and static analysis.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run tests
        run: python -m pytest -p no:cacheprovider -ra

  platforms:
    # Runs the whole test suite on Windows and macOS (issue #116). Atomic
    # writes (os.replace), file identity (os.path.samefile), symbolic and hard
    # links, temporary paths and line endings depend on the operating system,
    # so Linux alone does not prove them. Coverage, lint and type checks stay
    # in the quality job, where the 100% gate is measured on Linux.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run tests
        run: python -m pytest -p no:cacheprovider -ra

  sdist:
    # Builds the source distribution and runs the test suite from the unpacked
    # archive, outside the checkout, so a file the tests need but MANIFEST.in
    # leaves out fails here instead of for whoever packages a release.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Build the source distribution
        run: python -m build --sdist --outdir "$RUNNER_TEMP/dist" .

      - name: Run the tests from the unpacked source distribution
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar xzf "$RUNNER_TEMP"/dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"/sdist/*/
          python - <<'PY'
          from pathlib import Path

          for name in ("CONTRIBUTING.md", "SECURITY.md", "CITATION.cff"):
              path = Path(name)
              assert path.is_file(), path
          PY
          python -m pip install --no-deps .
          python - <<'PY'
          from pathlib import Path
          import csv_quality_report

          marker = Path(csv_quality_report.__file__).with_name("py.typed")
          assert marker.is_file(), marker
          PY
          python -m pytest -p no:cacheprovider

  action:
    # Runs the repository's own GitHub Action (action.yml) end to end.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Action passes on a clean file
        id: ok
        uses: ./
        with:
          path: examples/tiny.csv
          args: --delimiter auto --max-missing 50 --require-columns item,qty

      - name: Action fails when a quality gate fails
        id: gate
        continue-on-error: true
        uses: ./
        with:
          path: examples/sample.csv
          args: --max-duplicates 0
          summary: "false"

      - name: Absolute report path is refused
        id: absolute
        continue-on-error: true
        uses: ./
        with:
          path: examples/tiny.csv
          report-path: ${{ runner.temp }}/csv-quality-report-absolute.json
          summary: "false"

      - name: Escaping report path is refused
        id: escape
        continue-on-error: true
        uses: ./
        with:
          path: examples/tiny.csv
          report-path: ../csv-quality-report-escape.json
          summary: "false"

      - name: Absolute input CSV is refused
        id: input-absolute
        continue-on-error: true
        uses: ./
        with:
          path: ${{ github.workspace }}/examples/tiny.csv
          summary: "false"

      - name: Input CSV outside workspace is refused
        id: input-escape
        continue-on-error: true
        uses: ./
        with:
          path: ../outside-workspace.csv
          summary: "false"

      - name: Baseline outside workspace is refused, even in skip mode
        id: baseline-escape
        continue-on-error: true
        uses: ./
        with:
          path: examples/tiny.csv
          baseline: ../outside-workspace.json
          if-baseline-missing: skip
          summary: "false"

      - name: Extra arguments cannot override the validated baseline
        id: override
        continue-on-error: true
        uses: ./
        with:
          path: examples/tiny.csv
          args: --baseline=../unsafe.json
          summary: "false"

      - name: Make an existing report to test false-green outcomes
        shell: bash
        run: |
          mkdir -p reports
          printf '%s\\n' '{"rows":999,"old":true}' > reports/stale-report.json

      - name: Action refuses help even if a report already exists
        id: help-bypass
        continue-on-error: true
        uses: ./
        with:
          path: examples/tiny.csv
          args: --help
          report-path: reports/stale-report.json
          summary: "false"

      - name: Action refuses abbreviated version without profiling
        id: version-bypass
        continue-on-error: true
        uses: ./
        with:
          path: examples/tiny.csv
          args: --ver
          report-path: reports/stale-report.json
          summary: "false"

      - name: Action rejects informational options in baseline-args as well
        id: baseline-help-bypass
        continue-on-error: true
        uses: ./
        with:
          path: examples/tiny.csv
          baseline: reports/stale-report.json
          baseline-args: --version
          report-path: reports/noop-baseline.json
          summary: "false"

      - name: Check the action's outputs
        env:
          INPUT_ABSOLUTE_CODE: ${{ steps.input-absolute.outputs.exit-code }}
          INPUT_ABSOLUTE_PASSED: ${{ steps.input-absolute.outputs.passed }}
          INPUT_ABSOLUTE_OUTCOME: ${{ steps.input-absolute.outcome }}
          INPUT_ESCAPE_CODE: ${{ steps.input-escape.outputs.exit-code }}
          INPUT_ESCAPE_PASSED: ${{ steps.input-escape.outputs.passed }}
          INPUT_ESCAPE_OUTCOME: ${{ steps.input-escape.outcome }}
          BASELINE_ESCAPE_CODE: ${{ steps.baseline-escape.outputs.exit-code }}
          BASELINE_ESCAPE_PASSED: ${{ steps.baseline-escape.outputs.passed }}
          BASELINE_ESCAPE_USED: ${{ steps.baseline-escape.outputs.baseline-used }}
          BASELINE_ESCAPE_OUTCOME: ${{ steps.baseline-escape.outcome }}
          OVERRIDE_CODE: ${{ steps.override.outputs.exit-code }}
          OVERRIDE_PASSED: ${{ steps.override.outputs.passed }}
          OVERRIDE_OUTCOME: ${{ steps.override.outcome }}
          HELP_BYPASS_CODE: ${{ steps.help-bypass.outputs.exit-code }}
          HELP_BYPASS_PASSED: ${{ steps.help-bypass.outputs.passed }}
          HELP_BYPASS_JSON: ${{ steps.help-bypass.outputs.report-json }}
          HELP_BYPASS_OUTCOME: ${{ steps.help-bypass.outcome }}
          VERSION_BYPASS_CODE: ${{ steps.version-bypass.outputs.exit-code }}
          VERSION_BYPASS_PASSED: ${{ steps.version-bypass.outputs.passed }}
          VERSION_BYPASS_JSON: ${{ steps.version-bypass.outputs.report-json }}
          VERSION_BYPASS_OUTCOME: ${{ steps.version-bypass.outcome }}
          BASELINE_HELP_CODE: ${{ steps.baseline-help-bypass.outputs.exit-code }}
          BASELINE_HELP_PASSED: ${{ steps.baseline-help-bypass.outputs.passed }}
          BASELINE_HELP_JSON: ${{ steps.baseline-help-bypass.outputs.report-json }}
          BASELINE_HELP_OUTCOME: ${{ steps.baseline-help-bypass.outcome }}
          OK_CODE: ${{ steps.ok.outputs.exit-code }}
          OK_PASSED: ${{ steps.ok.outputs.passed }}
          OK_JSON: ${{ steps.ok.outputs.report-json }}
          GATE_CODE: ${{ steps.gate.outputs.exit-code }}
          GATE_PASSED: ${{ steps.gate.outputs.passed }}
          GATE_JSON: ${{ steps.gate.outputs.report-json }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          ABSOLUTE_CODE: ${{ steps.absolute.outputs.exit-code }}
          ABSOLUTE_PASSED: ${{ steps.absolute.outputs.passed }}
          ABSOLUTE_JSON: ${{ steps.absolute.outputs.report-json }}
          ABSOLUTE_OUTCOME: ${{ steps.absolute.outcome }}
          ESCAPE_CODE: ${{ steps.escape.outputs.exit-code }}
          ESCAPE_PASSED: ${{ steps.escape.outputs.passed }}
          ESCAPE_JSON: ${{ steps.escape.outputs.report-json }}
          ESCAPE_OUTCOME: ${{ steps.escape.outcome }}
        run: |
          set -x
          test "$INPUT_ABSOLUTE_CODE" = 2
          test "$INPUT_ABSOLUTE_PASSED" = false
          test "$INPUT_ABSOLUTE_OUTCOME" = failure
          test "$INPUT_ESCAPE_CODE" = 2
          test "$INPUT_ESCAPE_PASSED" = false
          test "$INPUT_ESCAPE_OUTCOME" = failure
          test "$BASELINE_ESCAPE_CODE" = 2
          test "$BASELINE_ESCAPE_PASSED" = false
          test "$BASELINE_ESCAPE_USED" = false
          test "$BASELINE_ESCAPE_OUTCOME" = failure
          test "$OVERRIDE_CODE" = 2
          test "$OVERRIDE_PASSED" = false
          test "$OVERRIDE_OUTCOME" = failure
          test "$HELP_BYPASS_CODE" = 2
          test "$HELP_BYPASS_PASSED" = false
          test -z "$HELP_BYPASS_JSON"
          test "$HELP_BYPASS_OUTCOME" = failure
          test "$VERSION_BYPASS_CODE" = 2
          test "$VERSION_BYPASS_PASSED" = false
          test -z "$VERSION_BYPASS_JSON"
          test "$VERSION_BYPASS_OUTCOME" = failure
          test "$BASELINE_HELP_CODE" = 2
          test "$BASELINE_HELP_PASSED" = false
          test -z "$BASELINE_HELP_JSON"
          test "$BASELINE_HELP_OUTCOME" = failure
          test ! -e reports/noop-baseline.json
          grep -Fq '"rows":999,"old":true' reports/stale-report.json
          test "$OK_CODE" = 0
          test "$OK_PASSED" = true
          test "$GATE_CODE" = 8
          test "$GATE_PASSED" = false
          test "$GATE_OUTCOME" = failure
          test "$ABSOLUTE_CODE" = 2
          test "$ABSOLUTE_PASSED" = false
          test -z "$ABSOLUTE_JSON"
          test "$ABSOLUTE_OUTCOME" = failure
          test ! -e "$RUNNER_TEMP/csv-quality-report-absolute.json"
          test "$ESCAPE_CODE" = 2
          test "$ESCAPE_PASSED" = false
          test -z "$ESCAPE_JSON"
          test "$ESCAPE_OUTCOME" = failure
          test ! -e "$GITHUB_WORKSPACE/../csv-quality-report-escape.json"
          python - <<'PY'
          import json, os
          ok = json.load(open(os.environ["OK_JSON"], encoding="utf-8"))
          assert ok["rows"] == 3 and ok["delimiter_detected"], ok
          assert ok["checks"] and all(c["passed"] for c in ok["checks"]), ok["checks"]
          gate = json.load(open(os.environ["GATE_JSON"], encoding="utf-8"))
          failed = [c["check"] for c in gate["checks"] if not c["passed"]]
          assert failed == ["max_duplicates"], failed
          print("action outputs OK")
          PY

      # A daily comparison chain: the first run has no baseline yet, the next
      # one compares with the report the first one kept.
      - name: First run without a baseline (if-baseline-missing skip)
        id: first
        uses: ./
        with:
          path: examples/tiny.csv
          args: --delimiter auto --record-time
          report-path: reports/day 1.json
          baseline: reports/missing baseline.json
          baseline-args: --fail-on-schema-change --max-baseline-age 1d
          if-baseline-missing: skip
          summary: "false"

      - name: Second run compared with the first report
        id: second
        uses: ./
        with:
          path: examples/tiny.csv
          args: --delimiter auto --record-time
          report-path: reports/day 2.json
          baseline: ${{ steps.first.outputs.report-json }}
          baseline-args: --fail-on-schema-change --max-baseline-age 1d

      - name: Schema gate fails against the baseline
        id: schema
        continue-on-error: true
        uses: ./
        with:
          path: examples/sample.csv
          baseline: reports/day 1.json
          baseline-args: --fail-on-schema-change
          summary: "false"

      - name: Missing baseline fails by default
        id: missing
        continue-on-error: true
        uses: ./
        with:
          path: examples/tiny.csv
          args: --delimiter auto
          baseline: reports/missing baseline.json
          summary: "false"

      - name: Invalid if-baseline-missing is refused
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          path: examples/tiny.csv
          baseline: reports/day 1.json
          if-baseline-missing: ignore
          summary: "false"

      - name: Check the baseline outputs
        env:
          FIRST_CODE: ${{ steps.first.outputs.exit-code }}
          FIRST_USED: ${{ steps.first.outputs.baseline-used }}
          FIRST_JSON: ${{ steps.first.outputs.report-json }}
          SECOND_CODE: ${{ steps.second.outputs.exit-code }}
          SECOND_USED: ${{ steps.second.outputs.baseline-used }}
          SECOND_JSON: ${{ steps.second.outputs.report-json }}
          SCHEMA_CODE: ${{ steps.schema.outputs.exit-code }}
          SCHEMA_USED: ${{ steps.schema.outputs.baseline-used }}
          SCHEMA_JSON: ${{ steps.schema.outputs.report-json }}
          MISSING_CODE: ${{ steps.missing.outputs.exit-code }}
          MISSING_USED: ${{ steps.missing.outputs.baseline-used }}
          MISSING_JSON: ${{ steps.missing.outputs.report-json }}
          MISSING_OUTCOME: ${{ steps.missing.outcome }}
          INVALID_CODE: ${{ steps.invalid.outputs.exit-code }}
          INVALID_OUTCOME: ${{ steps.invalid.outcome }}
        run: |
          set -x
          test "$FIRST_CODE" = 0
          test "$FIRST_USED" = false
          test "$FIRST_JSON" = "reports/day 1.json"
          test "$SECOND_CODE" = 0
          test "$SECOND_USED" = true
          test "$SECOND_JSON" = "reports/day 2.json"
          test "$SCHEMA_CODE" = 8
          test "$SCHEMA_USED" = true
          test "$MISSING_CODE" = 3
          test "$MISSING_USED" = false
          test -z "$MISSING_JSON"
          test "$MISSING_OUTCOME" = failure
          test "$INVALID_CODE" = 2
          test "$INVALID_OUTCOME" = failure
          python - <<'PY'
          import json, os
          first = json.load(open(os.environ["FIRST_JSON"], encoding="utf-8"))
          assert first["baseline"] is None and first["generated_at"], first
          second = json.load(open(os.environ["SECOND_JSON"], encoding="utf-8"))
          assert second["baseline"] is not None, second
          checks = {c["check"]: c["passed"] for c in second["checks"]}
          assert checks == {"schema_change": True, "baseline_age": True}, checks
          schema = json.load(open(os.environ["SCHEMA_JSON"], encoding="utf-8"))
          failed = [c["check"] for c in schema["checks"] if not c["passed"]]
          assert failed == ["schema_change"], failed
          print("action baseline outputs OK")
          PY
