[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-quality-report"
version = "0.2.0"
description = "Quick data-quality report for a CSV file (standard library only)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
authors = [{ name = "rodrix91" }]

[project.scripts]
csv-quality-report = "csv_quality_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"

[tool.coverage.run]
source = ["csv_quality_report"]
branch = true
patch = ["subprocess"]  # also measure the CLI tests that run `python -m`

[tool.coverage.report]
show_missing = true
fail_under = 100  # line + branch; exclusions need a `# pragma: no cover - reason`
